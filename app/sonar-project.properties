# ────────────────────────────────────────────────────────────────────
# SonarQube — SwiftX
#
# Scope: only SwiftX's own application code. The internals of Supabase,
# Anthropic / Groq, Razorpay, and AWS are out of scope (and would noise
# up the report).
#
# Run: npm run sonar  (after `npm test -- --coverage`)
# ────────────────────────────────────────────────────────────────────

sonar.projectKey=swiftx
sonar.projectName=SwiftX
sonar.projectVersion=1.0
sonar.organization=swiftx

# Source roots
sonar.sources=app,components,lib
sonar.tests=__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# Coverage report (LCOV emitted by Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=\
  .next/**,\
  node_modules/**,\
  coverage/**,\
  __tests__/load/**,\
  __tests__/e2e/**,\
  public/**,\
  supabase/**,\
  *.config.{js,ts,mjs},\
  next-env.d.ts

sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.spec.ts,\
  app/layout.tsx,\
  app/page.tsx,\
  **/loading.tsx,\
  **/error.tsx,\
  **/not-found.tsx,\
  components/Greeting.tsx,\
  __tests__/**

sonar.cpd.exclusions=\
  __tests__/**,\
  app/onboarding/kyc/**

# Quality Gate — these are the conditions we want the gate to enforce.
# Configure them in the SonarQube UI to match (the file is informational —
# Sonar resolves the gate by project on the server).
#   • No new bugs
#   • No new High / Critical vulnerabilities
#   • New code coverage ≥ 80%
#   • Duplication on new code ≤ 3%
#   • All new Security Hotspots reviewed

sonar.qualitygate.wait=true

# Useful for code-of-conduct: link issues back to the risk register
sonar.links.issue=https://github.com/<org>/swiftx/issues
sonar.links.scm=https://github.com/<org>/swiftx
