name: SwiftX CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # Build-time stubs (mirror buildspec.yml)
  NEXT_PUBLIC_SUPABASE_URL: 'https://dummy.supabase.co'
  NEXT_PUBLIC_SUPABASE_ANON_KEY: 'dummy-anon'
  SUPABASE_SERVICE_ROLE_KEY: 'dummy-service'
  GROQ_API_KEY: 'dummy'
  SERPER_API_KEY: 'dummy'
  NEXT_PUBLIC_RAZORPAY_KEY_ID: 'rzp_test_dummy'
  RAZORPAY_KEY_SECRET: 'dummy'
  RAZORPAY_DEV_MOCK: '1'

jobs:
  # ── 1. Unit + Integration ──────────────────────────────────────
  test:
    name: Unit + Integration
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }     # SonarQube needs full history

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: app/package-lock.json }

      - run: npm ci
      - run: npm run lint || true        # Non-blocking — Sonar is the gate
      - run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: app/coverage
          retention-days: 14

  # ── 2. Build ───────────────────────────────────────────────────
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: test
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            app/.next/standalone
            app/.next/static
          retention-days: 7

  # ── 3. SonarQube ───────────────────────────────────────────────
  sonar:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: test
    # Skip the Sonar job on forks where the secret isn't available
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/download-artifact@v4
        with:
          name: jest-coverage
          path: app/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: app

      # ── 4. Archive Sonar report to S3 (compliance evidence) ───
      - name: Configure AWS credentials
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Fetch SonarQube JSON report and push to S3
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SHA=${{ github.sha }}
          mkdir -p sonar-archive
          curl -sSf -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/measures/component?component=swiftx&metricKeys=bugs,vulnerabilities,security_hotspots,coverage,duplicated_lines_density,code_smells,sqale_index" \
            > "sonar-archive/${DATE}_${SHA:0:7}.json"
          aws s3 cp "sonar-archive/${DATE}_${SHA:0:7}.json" \
            "s3://${{ secrets.SONAR_S3_BUCKET }}/sonarqube-reports/${DATE}_${SHA:0:7}.json" \
            --sse AES256

  # ── 5. E2E (Playwright) — runs on PRs only ─────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'pull_request' }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project=chromium-desktop
        env:
          E2E_BASE_URL: http://localhost:3000
          # E2E_ADMIN_EMAIL/E2E_ADMIN_PASSWORD wired via repo secrets when ready
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 14
